name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  contract-lint-test:
    name: Contract - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/geoguard-ledger
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/geoguard-ledger/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/geoguard-ledger/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Run tests
        run: cargo test --verbose

  migrations:
    name: Backend - Migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: geoguard
          POSTGRES_PASSWORD: geoguard_dev
          POSTGRES_DB: geoguard_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        run: uv sync --dev

      # Migrations are applied to a real Postgres once per run, here, instead of
      # in every job that wants a database. A job's service containers are
      # private to it, so this database is not the one later jobs connect to —
      # the backend suite runs on in-memory SQLite regardless. What this job owns
      # is the migration contract: that the chain applies to Postgres, and that
      # the models still match what it produces.
      - name: Apply migrations and check them against the models
        run: |
          uv run alembic upgrade head

          # `alembic check` runs the autogenerate comparison and fails only when
          # the models would require new operations. Do not infer drift from the
          # existence of a generated revision file: Alembic always writes one,
          # so even an empty migration (nothing to change) would look like drift.
          uv run alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://geoguard:geoguard_dev@localhost:5432/geoguard_ledger

  backend-lint-test:
    name: Backend - Lint & Test
    # The suite runs against in-memory SQLite, so this job needs no database of
    # its own — it used to carry a Postgres service purely to run Alembic, which
    # the job above now owns. Waiting on that job means a broken migration fails
    # before the tests run rather than alongside them.
    needs: [migrations]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Format check with ruff
        run: uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy app/

      # `term-missing` prints the uncovered lines next to the summary so a drop is
      # diagnosable from the log, and `--cov-fail-under` turns the number into a
      # gate: coverage can climb but not slide back unnoticed.
      - name: Run tests
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  frontend-lint-test:
    name: Frontend - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm run test -- --run

      # `npm run build` runs `tsc -b`, which is the only thing that type-checks
      # vite.config.ts and the tsconfig.node.json project — the `typecheck`
      # script above only covers `src`. Keeping the build in CI is what stops a
      # broken build config from reaching main unnoticed.
      - name: Production build
        run: npm run build

  brand-assets:
    name: Brand - Assets Match Generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The mark is generated from a single source of truth, so the committed
      # SVG and PNGs have to stay what the script produces — otherwise editing
      # the geometry and forgetting to re-run it would leave the README and the
      # favicon showing a mark the code no longer describes. This needs no
      # dependencies, hence no `uv sync`: the generator is stdlib only.
      - name: Check the committed logo is current
        run: python3 scripts/generate_logo.py --check

  schema-boot:
    name: Backend - Schema From Migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: geoguard
          POSTGRES_PASSWORD: geoguard_dev
          POSTGRES_DB: geoguard_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        run: uv sync --dev

      # Three properties, all of which have silently broken this project before:
      # starting the app must not create tables (that leaves a database with no
      # recorded revision, and `alembic upgrade head` then fails on it forever),
      # the boot command must not run migrations (that runs once per replica, so
      # replicas starting together race through the same DDL), and the migration
      # step plus the boot command must together bring an empty database to a
      # serving state. Both commands are read out of the files that ship, and run
      # against empty scratch databases that are dropped again afterwards.
      - name: Check the migration step and the boot sequence
        run: uv run python ../scripts/check_boot_migrations.py
        env:
          DATABASE_URL: postgresql+asyncpg://geoguard:geoguard_dev@localhost:5432/geoguard_ledger

  commit-attribution:
    name: Commits - No AI Attribution
    runs-on: ubuntu-latest
    steps:
      # The check audits every reachable commit, not just the pushed range, so
      # it needs the full graph rather than the default single-commit checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Stdlib-only, like the brand check: the script reads commit messages
      # with `git log` and awk, so there is nothing to install first.
      - name: Check commit messages for AI attribution
        run: scripts/check_no_ai_attribution.sh

  all-pass:
    name: All Checks Pass
    needs: [contract-lint-test, migrations, backend-lint-test, frontend-lint-test, brand-assets, schema-boot, commit-attribution]
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ All checks passed"
