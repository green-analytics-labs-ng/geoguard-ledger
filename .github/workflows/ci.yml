name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  contract-lint-test:
    name: Contract - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/geoguard-ledger
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/geoguard-ledger/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/geoguard-ledger/Cargo.lock') }}

      # cargo-audit checks Cargo.lock against the RustSec advisory database. It
      # reads the lockfile rather than the compiled output, so it needs no wasm32
      # target and belongs before the target-specific steps. `--locked` pins
      # cargo-audit's own dependency tree to what was published and reviewed.
      - name: Audit dependencies with cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Run tests
        run: cargo test --verbose

  migrations:
    name: Backend - Migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: geoguard
          POSTGRES_PASSWORD: geoguard_dev
          POSTGRES_DB: geoguard_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        run: uv sync --dev

      # Migrations are applied to a real Postgres once per run, here, instead of
      # in every job that wants a database. A job's service containers are
      # private to it, so this database is not the one later jobs connect to —
      # the backend suite runs on in-memory SQLite regardless. What this job owns
      # is the migration contract: that the chain applies to Postgres, and that
      # the models still match what it produces.
      - name: Apply migrations and check them against the models
        run: |
          uv run alembic upgrade head

          # `alembic check` runs the autogenerate comparison and fails only when
          # the models would require new operations. Do not infer drift from the
          # existence of a generated revision file: Alembic always writes one,
          # so even an empty migration (nothing to change) would look like drift.
          uv run alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://geoguard:geoguard_dev@localhost:5432/geoguard_ledger

  backend-lint-test:
    name: Backend - Lint & Test
    # The suite runs against in-memory SQLite, so this job needs no database of
    # its own — it used to carry a Postgres service purely to run Alembic, which
    # the job above now owns. Waiting on that job means a broken migration fails
    # before the tests run rather than alongside them.
    needs: [migrations]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        run: uv sync --dev

      # pip-audit scores the resolved dependency set against the GitHub Advisory
      # database and PyPI's OSV feed. `uv run --with` drops it into the same
      # environment `uv sync` just built, so it audits what CI actually installs
      # rather than what the constraints nominally allow. A known vulnerability
      # fails the job here; Dependabot (.github/dependabot.yml) is what keeps the
      # fixed versions arriving before that happens.
      - name: Audit dependencies with pip-audit
        run: uv run --with pip-audit pip-audit

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Format check with ruff
        run: uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy app/

      # `term-missing` prints the uncovered lines next to the summary so a drop is
      # diagnosable from the log, and `--cov-fail-under` turns the number into a
      # gate: coverage can climb but not slide back unnoticed.
      - name: Run tests
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      # Uploaded even when the suite failed, so a drop is still comparable with
      # the previous run. `coverage-report` turns this into the pull request
      # comment; nothing depends on it being present.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend-lint-test:
    name: Frontend - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Production dependencies only. A dev-toolchain advisory never reaches a
      # user, and failing on one would train us to wave the check through; the
      # packages that ship are the ones that have to be clean. `npm audit fix`
      # and Dependabot supply the upgrades this gate asks for.
      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm run test -- --run

      # `npm run build` runs `tsc -b`, which is the only thing that type-checks
      # vite.config.ts and the tsconfig.node.json project — the `typecheck`
      # script above only covers `src`. Keeping the build in CI is what stops a
      # broken build config from reaching main unnoticed.
      - name: Production build
        run: npm run build

  coverage-report:
    name: Coverage - Comment the delta
    # Pull requests only: on a push there is no conversation to comment in, and
    # the sticky comment would have no thread to land in. Both suites have to
    # finish first because their artifacts are the input.
    if: github.event_name == 'pull_request'
    needs: [backend-lint-test, frontend-lint-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `gh run download` reads the base branch's artifacts, and the comment
      # itself needs write access to the pull request.
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Download this run's coverage
        # A job that failed before it wrote a report must not turn a coverage
        # comment into a second failure, so a missing artifact is tolerated.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: "*-coverage"
          path: head-coverage

      # The base branch is the reference point for the delta. Its most recent
      # run on that branch is what a reviewer would call "the number before this
      # change", which the run for this pull request's merge base is not.
      - name: Download the base branch's coverage
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for artifact in backend-coverage frontend-coverage; do
            gh run download \
              --repo "$GITHUB_REPOSITORY" \
              --branch "${{ github.base_ref }}" \
              --name "$artifact" \
              --dir "base-coverage/$artifact" || true
          done

      - name: Write the coverage summary
        run: |
          python3 scripts/coverage_delta.py \
            --head head-coverage \
            --base base-coverage \
            --base-label "${{ github.base_ref }}" \
            --out coverage-comment.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage-comment.md

  brand-assets:
    name: Brand - Assets Match Generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The mark is generated from a single source of truth, so the committed
      # SVG and PNGs have to stay what the script produces — otherwise editing
      # the geometry and forgetting to re-run it would leave the README and the
      # favicon showing a mark the code no longer describes. This needs no
      # dependencies, hence no `uv sync`: the generator is stdlib only.
      - name: Check the committed logo is current
        run: python3 scripts/generate_logo.py --check

  schema-boot:
    name: Backend - Schema From Migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: geoguard
          POSTGRES_PASSWORD: geoguard_dev
          POSTGRES_DB: geoguard_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        run: uv sync --dev

      # Three properties, all of which have silently broken this project before:
      # starting the app must not create tables (that leaves a database with no
      # recorded revision, and `alembic upgrade head` then fails on it forever),
      # the boot command must not run migrations (that runs once per replica, so
      # replicas starting together race through the same DDL), and the migration
      # step plus the boot command must together bring an empty database to a
      # serving state. Both commands are read out of the files that ship, and run
      # against empty scratch databases that are dropped again afterwards.
      - name: Check the migration step and the boot sequence
        run: uv run python ../scripts/check_boot_migrations.py
        env:
          DATABASE_URL: postgresql+asyncpg://geoguard:geoguard_dev@localhost:5432/geoguard_ledger

  commit-attribution:
    name: Commits - No AI Attribution
    runs-on: ubuntu-latest
    steps:
      # The check audits every reachable commit, not just the pushed range, so
      # it needs the full graph rather than the default single-commit checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Stdlib-only, like the brand check: the script reads commit messages
      # with `git log` and awk, so there is nothing to install first.
      - name: Check commit messages for AI attribution
        run: scripts/check_no_ai_attribution.sh

  all-pass:
    name: All Checks Pass
    needs: [contract-lint-test, migrations, backend-lint-test, frontend-lint-test, coverage-report, brand-assets, schema-boot, commit-attribution]
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ All checks passed"
