version: 2

# Supply chain upkeep, so the audits in `ci.yml` are not the only thing that
# ever notices an outdated or vulnerable dependency. Every manifest in the repo
# is covered here.
#
# Grouping is deliberately split by semver level: patch and minor bumps arrive
# as one reviewable PR per ecosystem, while a major bump gets its own PR,
# because that is the one that needs reading before it merges.
updates:
  # The backend is a uv project, so this is the `uv` ecosystem rather than
  # `pip`. uv.lock is committed and is what `uv sync` installs; the `pip`
  # ecosystem would bump pyproject.toml and leave the lockfile behind, which is
  # exactly the drift `uv sync --locked` fails on.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-patch-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-patch-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # eslint 10 is blocked upstream, not here: eslint-plugin-jsx-a11y, whose
      # current release still peers `eslint@^3 || ... || ^9`, is the last plugin
      # in this tree that has not opened up to ^10. A tree containing eslint 10
      # therefore cannot resolve at all, so `npm ci` fails before a single check
      # runs and the pull request spends every week red for a reason no commit
      # can fix. Delete this entry once jsx-a11y accepts ^10.
      #
      # Only major 10 is held back — eslint 9.x still reaches the group above.
      - dependency-name: "eslint"
        versions: [">=10"]

  # Soroban pins its own toolchain and SDK generation, so contract bumps are the
  # ones most likely to need a code change alongside them.
  - package-ecosystem: "cargo"
    directory: "/contracts/geoguard-ledger"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      contract-patch-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The workflows pin actions by major tag, so this is what notices when a
  # pinned action has a security release.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
