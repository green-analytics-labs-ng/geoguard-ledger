[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geoguard-ledger-backend"
version = "0.3.0"
description = "GeoGuard Ledger — FastAPI backend for research integrity anchoring"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "stellar-sdk>=12.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.14.0",
]

# Console scripts installed alongside the package, so a scheduler (cron,
# systemd, Kubernetes CronJob) can call the job by name rather than by module
# path. `main` returns the process exit code; the generated wrapper passes it
# to `sys.exit`.
[project.scripts]
geoguard-renew-ttl = "app.jobs.renew_ttl:main"

[tool.hatch.build.targets.wheel]
# The distribution is `geoguard-ledger-backend` but the import package is
# `app`, so hatchling needs to be told where the code lives.
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# SQLAlchemy's async session runs its synchronous work inside a greenlet, and
# coverage.py stops attributing lines across those switches unless it is told
# to trace greenlets. Without this, a route handler's body is reported as
# missing from its first `await db...` onward even though the tests covered it
# end to end: batches.py measured 53% against a true 99%, and datasets.py 70%
# against 100%. That misreport also hid that overall coverage was 89%, not the
# 79.6% it looked like.
concurrency = ["greenlet"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]
