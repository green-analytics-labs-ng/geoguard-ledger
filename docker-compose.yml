version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: geoguard
      POSTGRES_PASSWORD: geoguard_dev
      POSTGRES_DB: geoguard_ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoguard -d geoguard_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Migrations are their own one-shot service rather than part of the backend's
  # boot command. There is exactly one of these, so it cannot race itself the way
  # several replicas each running `alembic upgrade head` on startup would. A
  # database that is behind fails here, with Alembic's own diagnostics, before
  # any server tries to read it.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://geoguard:geoguard_dev@db:5432/geoguard_ledger
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.venv
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://geoguard:geoguard_dev@db:5432/geoguard_ledger
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      SOROBAN_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      # Current Testnet deployment: standalone anchors, batch roots with
      # on-chain inclusion proofs, and both TTL renewal entry points.
      # Deployments are permanent and never replace an earlier instance, so a
      # deployment can lag this source — docs/deployment.md has the runbook.
      CONTRACT_ID: "CBY2P6QWTUYNRXFL6HDXOMUUBUZT4VORPBOLUFRWOIRANK7VCLMYCXC4"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      # The backend waits for migrations to exit 0, so `docker compose up` still
      # works from an empty database without the server ever serving a schema
      # that is halfway migrated.
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      # Keep the image's virtualenv rather than the host's. The two are built
      # for different interpreters, so an exposed host `.venv` makes `uv run`
      # rebuild the environment inside the mount — deleting the developer's own
      # `.venv` on every `docker compose up` and taking ~45s over it. The
      # frontend service guards node_modules the same way.
      - /app/.venv

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
